version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: idea-ai-chat
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - idea-network

networks:
  idea-network:
    driver: bridge

volumes:
  static-data:
    driver: local
